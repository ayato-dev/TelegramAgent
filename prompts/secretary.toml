# Secretary mode: the bot answers people in your private chats on your behalf.
#
# Connect it in Telegram: Settings → Telegram Business → Chatbots → pick this bot, choose the chats it
# may access and allow it to reply to messages. Only accounts listed in ALLOWED_USER_IDS can use it.
# What the bot says is set by secretary.md next to this file.
#
# The file is read at startup. A setting left out keeps the default shown here.

# false switches secretary mode off without disconnecting the bot in Telegram.
enabled = true

# Telegram doesn't tell bots whether you are online. The bot counts you as online for this many
# minutes after your last message in any chat it is connected to, or to the bot itself.
online_minutes = 10

# Reply while you are online. With false the bot waits until you have been away for online_minutes,
# and stays silent if you answer the person yourself first.
reply_when_online = false

# Seconds to wait after the person's last message, so several messages in a row get one reply.
delay_seconds = 5

# At most max_replies replies per chat within limit_hours. Your own message in the chat starts the
# count over. 0 removes the limit.
max_replies = 3
limit_hours = 24

# Reply only during these hours, local time (TIMEZONE), e.g. "09:00-23:00" or "22:00-08:00".
# Empty: any time.
hours = ""

# Transcribe voice and video notes (needs GROQ_API_KEY). With false the bot sees only a label
# such as [голосовое 0:42].
voice = true

# How many of the chat's latest messages the model reads.
history = 30

# The model that answers, e.g. "anthropic:claude-haiku-5-5". Empty: the model chosen in /settings.
model = ""
